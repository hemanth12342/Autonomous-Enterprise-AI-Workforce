# =============================================================
# render.yaml — Render Blueprint for Autonomous Enterprise AI
# Deploys: FastAPI Backend + Celery Worker
# Databases: Managed PostgreSQL + Redis (add via Render dashboard
#             or provision separately via Neon/Upstash)
# =============================================================

services:
  # ─── FastAPI Backend ─────────────────────────────────────────
  - type: web
    name: autonomous-ai-backend
    runtime: python
    region: oregon          # Change to your preferred region
    plan: starter           # free | starter | standard | plus
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      # ─── Application ─────────────────────────────────────
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DEMO_MODE
        value: "false"

      # ─── Secrets (Set via Render dashboard → Environment) ─
      - key: APP_SECRET_KEY
        generateValue: true   # Auto-generated by Render
      - key: JWT_SECRET
        generateValue: true

      # ─── Database ────────────────────────────────────────
      # Set DATABASE_URL from your Neon/Render Postgres instance
      - key: DATABASE_URL
        sync: false           # Must be set manually in Render dashboard

      # ─── Redis ───────────────────────────────────────────
      # Set REDIS_URL from your Upstash/Render Redis instance
      - key: REDIS_URL
        sync: false

      # ─── Neo4j ───────────────────────────────────────────
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false

      # ─── LLM — OpenRouter ────────────────────────────────
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-opus-5:batch
      - key: OPENROUTER_FAST_MODEL
        value: anthropic/claude-haiku-4-5
      - key: OPENROUTER_SITE_URL
        sync: false           # Set to your Vercel frontend URL
      - key: OPENROUTER_APP_NAME
        value: "Autonomous Enterprise AI Workforce"

      # ─── CORS ─────────────────────────────────────────────
      - key: ALLOWED_ORIGINS
        sync: false           # Set to your Vercel URL, e.g. https://your-app.vercel.app

      # ─── Agent Limits ────────────────────────────────────
      - key: MAX_CONCURRENT_AGENTS
        value: "5"
      - key: MAX_AGENT_RETRIES
        value: "3"

  # ─── Celery Worker ────────────────────────────────────────────
  - type: worker
    name: autonomous-ai-worker
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: celery -A app.worker worker --loglevel=info --concurrency=2
    autoDeploy: true

    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
